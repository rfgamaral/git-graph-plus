name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # git-flow is required for the Git Flow integration tests
      # (submodule-lfs-flow.integration.test.ts). Without it those tests
      # auto-skip via describe.skipIf — installing it ensures full coverage
      # of the flow* methods on CI.
      - name: Install git-flow
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git-flow

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install webview dependencies
        run: cd webview-ui && npm ci

      - name: Type check (extension)
        run: npm run lint

      - name: Type check (webview)
        run: cd webview-ui && npm run check

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build:extension

      - name: Build webview
        run: npm run build:webview

      - name: Upload release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: |
            dist/
            webview-ui/dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release build
        uses: actions/download-artifact@v8
        with:
          name: release-build

      - name: Release VSIX on GitHub
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
